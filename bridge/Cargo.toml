[package]
name = "apple-device-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
idevice = { version = "=0.1.68", features = ["usbmuxd", "installation_proxy", "house_arrest"] }
plist = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
